incidents:
  - time: "2026-08-20T00:05:15+08:00"
    stage: dataset_transfer
    cause: 原始 aria2 队列被服务器不可达的 Hugging Face JSON 元数据 URL 占据，最终以 0 B/s 退出
    impact: 82 个 TFRecord 未完成；已有 271 个文件保持原样
    recovery: >-
      按固定清单筛出 82 个 TFRecord，刷新 CDN 签名 URL 后续传；同时修正中断遗留的
      aria2 control sidecars 会造成完成判定假失败的问题，并无损重启 supervisor
  - time: "2026-08-20T00:28:00+08:00"
    stage: base_checkpoint_transfer
    cause: 并行 rsync 替换了 aria2 已打开的目标文件，旧 aria2 的 5 个输出句柄继续指向 deleted inodes
    impact: 可见的 24 个权重对象完整，但旧进程继续产生无效网络与磁盘写入
    recovery: >-
      对可见 payload 执行官方 GCS size/MD5 校验并确认 24/24 一致后，终止旧下载器；
      将 5 个 aria2 control sidecars 移入可恢复归档目录，未删除或覆盖权重
  - time: "2026-08-20T00:32:48+08:00"
    stage: dataset_sha256
    cause: 首轮中断遗留的 12 个同尺寸 TFRecord 仍有未完成 byte ranges，尺寸门禁无法识别
    impact: 全量 SHA-256 正确拦截差异并停止 supervisor，训练未启动
    recovery: >-
      使用本地固定 revision 对 12 个文件执行 rsync checksum 差分修复并逐文件复核 SHA；
      同时允许 3 个 loader 生成的 dataset_statistics cache 不参与固定 payload 集合比较，
      再次运行全量校验后 353/353 参考文件全部一致
  - time: "2026-08-20T00:53:19+08:00"
    stage: pretraining_initialization
    cause: >-
      项目固定的 JAX/JAXlib 0.5.0 早于 RTX 6000D 的 sm_120 支持；首个 GPU
      train-state 编译在 BF16 转 FP16 时触发 LLVM Unsupported rounding mode
    impact: >-
      retain_repro_pretrain 在 step 0 前以 exit 134 停止；未产生数值 checkpoint，
      数据、优化器配置和真实 batch 均已在退出前成功初始化
    recovery: >-
      不修改主 .venv，在共享盘建立 JAX 0.6.2/CUDA 12 隔离 overlay，并加入
      conservative Triton GEMM compatibility flag；7/7 真实输入、Orbax restore 和
      train-state shape 的 CPU 兼容测试通过；修复后 supervisor 已重跑数据、权重与
      7-config 输入门禁，待空闲 GPU 上执行最小 BF16 编译门禁
  - time: "2026-08-20T03:50:02+08:00"
    stage: gpu_runtime_preflight_and_pretraining_initialization
    cause: >-
      初版 JAX 0.6.2 overlay 只隔离 cuDNN，其他 CUDA wheels 仍复用主环境；纯 JAX
      preflight 因 CUDA libraries 不可见回退 CPU，且旧门禁未校验 device platform；
      训练进程随后加载主环境 cuDNN 9.7.1，与 plugin build 所需 9.8.0 不兼容
    impact: >-
      attempt 2 在 step 0 前以 exit 1 停止，未产生数字 checkpoint；错误的 CPU
      preflight 已明确标记为 invalid，不能作为 GPU runtime 成功证据
    recovery: >-
      将 JAX plugin 所需 CUDA wheels 全部固定到隔离 overlay，显式优先其动态库路径，
      并把唯一可见设备且 platform=gpu 设为硬门禁；12/12 动态库与 CPU smoke 通过后，
      supervisor 已重跑数据、权重和 7-config 输入门禁并进入新一轮安全等待
  - time: "2026-08-20T06:49:20+08:00"
    stage: pretraining_first_optimizer_step_memory
    cause: >-
      完整 batch-64 train step 的 XLA 图经 rematerialization 仍为 75.44 GiB，且无法降到
      约 25.07 GiB 的目标；执行时还需申请 27.79 GiB 大块 buffer，超出单卡临时内存安排
    impact: >-
      attempt 3 在严格 GPU preflight 真实通过后进入完整训练，但首个 optimizer step
      以 RESOURCE_EXHAUSTED 退出；未产生 Step 0 指标或数字 checkpoint
    recovery: >-
      先以 95% BFC pool 和 cudaMallocAsync 分别做排除性重试；两次均失败后确认不是简单的
      0.16 GiB pool 缺口，最终在明确记录偏差的前提下把单卡物理 batch 缩小到 16
  - time: "2026-08-20T07:59:32+08:00"
    stage: pretraining_first_optimizer_step_memory
    cause: >-
      attempt 4 在 95% BFC pool 下仍无法满足 batch-64 的同一 27.79 GiB buffer 请求；
      初步怀疑固定 arena 碎片化
    impact: >-
      严格 GPU preflight 通过，但仍早于 Step 0 指标和数字 checkpoint，以 exit 1 停止
    recovery: >-
      按 JAX 官方文档请求 cudaMallocAsync growing pool，保留模型、batch 和全部论文优化参数；
      完整现场归档到 pretrain-jax062-batch64-bfc-fragmentation-20260820T0759
  - time: "2026-08-20T08:21:04+08:00"
    stage: pretraining_first_optimizer_step_memory
    cause: >-
      attempt 5 请求 cudaMallocAsync，但 runtime 日志仍显示 GPU_0_bfc，并在同一 27.79 GiB
      buffer 处 OOM；attempts 3--5 共同证明 batch 64 不适合当前单张 85,651 MiB GPU
    impact: >-
      严格 GPU preflight 再次通过，但仍无 Step 0 指标或数字 checkpoint，exit code 为 1
    recovery: >-
      七个训练 config 的物理 batch 从论文 64 缩小到 16，不使用 gradient accumulation；
      steps、LR、AdamW、clip、EMA、mixture、seed、模型和数据均保持不变，并将差异写入状态
  - time: "2026-08-20T15:14:37+08:00"
    stage: pretraining_step_9000_checkpoint_host_transfer
    cause: >-
      systemd 明确记录 attempt 6 所属 session scope 中的进程被主机 OOM killer 终止；
      Orbax 临时目录只完成约 12.0 GB params，尚未写出可提交的 train_state
    impact: >-
      attempt 6 以 exit 137 停止；step 9000 临时目录不可恢复，但已验证 step 8000
      checkpoint 保持完整；训练日志证明数值指标稳定到 step 8975
    recovery: >-
      锁定 R1 恢复协议，从 step 8000 恢复并跳过 step 9000 中间全量保存，最终 step 9999
      只保存 EMA/inference params；归档 metadata/manifest/status/log 后删除 12.0 GB 无效临时分片，
      总控改由独立 systemd transient service 运行并重跑全部输入门禁
